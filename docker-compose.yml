services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: resq
      POSTGRES_USER: resq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resq-local-only}
    ports: ["5432:5432"]
    volumes: ["resq_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resq -d resq"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://resq:${POSTGRES_PASSWORD:-resq-local-only}@db:5432/resq
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  resq_db:
